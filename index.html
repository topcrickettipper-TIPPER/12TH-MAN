<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12Th Man - No. 1 Tipper</title>
    <!-- FontAwesome Icons for Telegram Logo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #0d1117; /* Dark premium background */
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobile First Container */
        .wrapper {
            max-width: 450px;
            width: 100%;
            background: radial-gradient(circle at top, #1a2332 0%, #0d1117 100%);
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Badge */
        .badge {
            background-color: #ff2a2a;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* Main Title - 12TH MAN */
        .main-title {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 5px;
            /* Gold Gradient Effect */
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .sub-title {
            font-size: 18px;
            color: #00e676;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Stats Strip */
        .stats {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #e0e0e0;
        }
        
        .stats span {
            color: #ffcc00;
            font-weight: bold;
        }

        /* Proof Image Section */
        .proof-container {
            margin-bottom: 25px;
            position: relative;
        }

        .proof-img {
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            border: 3px solid #bf953f;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* Urgency & Timer */
        .urgency-box {
            background-color: #ffebee;
            color: #d32f2f;
            border: 2px dashed #d32f2f;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 15px;
        }

        #timer {
            font-size: 22px;
            color: #b71c1c;
            display: block;
            margin-top: 5px;
            font-weight: 900;
        }

        /* Telegram Button */
        .telegram-btn {
            background: linear-gradient(135deg, #0088cc 0%, #005580 100%);
            color: white;
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
            box-shadow: 0 0 15px rgba(0, 136, 204, 0.6);
            animation: pulse-btn 1.5s infinite;
            border: 2px solid #33aadd;
            transition: all 0.3s ease;
        }

        .telegram-btn:hover {
            transform: scale(1.05);
        }

        @keyframes pulse-btn {
            0% { box-shadow: 0 0 0 0 rgba(0, 136, 204, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 136, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 136, 204, 0); }
        }

        /* Footer */
        .footer-text {
            font-size: 13px;
            color: #888;
            margin-top: auto;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="badge">🔥 No. 1 Tipper in Market 🔥</div>
            <h1 class="main-title">12TH MAN</h1>
            <h2 class="sub-title">Back to Back Pass Guarantee</h2>
        </header>

        <div class="stats">
            Match Winner | Session | Toss <br>
            Accuracy: <span>98%</span>
        </div>

        <div class="action-section">
            <div class="urgency-box">
                WARNING: FREE LINK EXPIRES IN
                <span id="timer">15</span>
            </div>

            <a href="https://https://t.me/+xA3Jkbq4kfE3ODA1" class="telegram-btn" target="_blank">
                <i class="fab fa-telegram-plane"></i> JOIN TELEGRAM FREE
            </a>
            
            <p style="margin-top: 10px; font-size: 14px; color: #ffcc00; font-weight: bold;">
                Hurry! Only 14 Free Spots Left.
            </p>
        </div>

        <div class="footer-text">
            © 2024 12Th Man VIP. All Rights Reserved.
        </div>
    </div>

    <!-- Countdown Timer Script -->
    <script>
        function startTimer(duration, display) {
            let timer = duration, minutes, seconds;
            setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    timer = 0; // Timer stops at 00:00
                }
            }, 1000);
        }

        window.onload = function () {
            // 3 minutes countdown
            let threeMinutes = 60 * 3,
                display = document.querySelector('#timer');
            startTimer(threeMinutes, display);
        };
    </script>

</body>
</html>
