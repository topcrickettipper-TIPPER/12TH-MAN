<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12th Man - No. 1 Tipper</title>
    <!-- FontAwesome icons ke liye link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0c1421; /* Dark background */
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        /* Browser Bar simulation */
        .browser-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: #1a2536; /* Slightly lighter top bar */
            padding: 10px 15px;
            box-sizing: border-box;
            border-bottom: 1px solid #2e3b4e;
        }

        .icons-left, .icons-right {
            display: flex;
            gap: 15px;
            color: #b0b0b0;
            font-size: 1.2em;
        }

        .title-bar {
            text-align: center;
            flex-grow: 1;
        }

        .site-title {
            font-weight: bold;
            font-size: 0.9em;
        }

        .site-url {
            font-size: 0.75em;
            color: #b0b0b0;
        }

        /* Main content container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px; /* Mobile width constraint */
            margin-top: 40px;
            text-align: center;
        }

        .top-tag {
            background-color: #ff0000; /* Red tag */
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-bottom: 20px;
        }

        h1 {
            color: #ffd700; /* Gold/Yellow title */
            font-size: 3em;
            margin: 0 0 10px 0;
            font-weight: bold;
        }

        .pass-guarantee {
            color: #00ff00; /* Green sub-title */
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .accuracy-box {
            background-color: #313d4f; /* Grey box */
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .accuracy-box p {
            margin: 5px 0;
            font-size: 1em;
            color: #b0b0b0;
        }

        .accuracy-percentage {
            color: #ffd700;
            font-weight: bold;
        }

        .timer-box {
            background-color: #f7f7f7; /* White box */
            border: 2px dashed #ff0000; /* Red dashed border */
            color: #ff0000;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        .timer-box p {
            margin: 0;
            font-size: 1em;
            font-weight: bold;
        }

        .timer-box .expire-time {
            font-size: 2em;
            color: #0c1421;
        }

        /* The main Telegram button */
        .telegram-button {
            background-color: #0088cc; /* Telegram Blue */
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .telegram-button i {
            font-size: 1.4em;
        }

        .spots-left {
            color: #ffd700;
            font-size: 0.9em;
            font-weight: bold;
        }

        /* --- BLINKING ANIMATION --- */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; } /* Thoda dim hota hai beech mein */
            100% { opacity: 1; }
        }

        .blinking-button {
            animation: blink 1.2s infinite; /* 1.2 seconds mein ek blink, infinite chalta rahega */
        }
    </style>
</head>
<body>

               <div class="site-url">pcrickettipper-tipper.github.io</div>
        </div>
        <div class="icons-right"><i class="fas fa-share-alt"></i> <i class="fas fa-ellipsis-v"></i></div>
    </div>

    <!-- Main Landing Page Content -->
    <div class="container">
        <div class="top-tag">🔥 NO. 1 TIPPER IN MARKET 🔥</div>
        
        <h1>12TH MAN</h1>
        
        <p class="pass-guarantee">BACK TO BACK PASS GUARANTEE</p>
        
        <div class="accuracy-box">
            <p>Match Winner | Session | Toss</p>
            <p>Accuracy: <span class="accuracy-percentage">98%</span></p>
        </div>
        
        <div class="timer-box">
            <p>WARNING: FREE LINK EXPIRES IN</p>
            <p class="expire-time">02:56</p>
        </div>
        
        <!-- The Blinking Button -->
        <a href="#" class="telegram-button blinking-button">
            <i class="fab fa-telegram-plane"></i> JOIN TELEGRAM FREE
        </a>
        
        <p class="spots-left">Hurry! Only 14 Free Spots Left.</p>
    </div>

</body>
</html>
