*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background-color:#0f1015;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}
.container{max-width:340px;width:100%;background-color:#1c1d22;padding:20px 15px;border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,0.6);text-align:center;border:1px solid #2a2c33}
.alert-bar{background:linear-gradient(90deg,#ff416c,#ff4b2b);color:#fff;padding:6px 8px;border-radius:6px;font-size:12px;font-weight:600;margin-bottom:12px;animation:pulse-alert 2s infinite}

h1{font-size:22px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:5px}

.stats-box b{color:#f1c40f}
.timer-text{color:#ff4b2b;font-size:14px;font-weight:700;margin-bottom:12px}
.join-btn{display:block;background:linear-gradient(90deg,#2AABEE,#2298d6);color:#fff;text-decoration:none;font-size:16px;font-weight:700;padding:12px;border-radius:25px;margin-bottom:12px;box-shadow:0 4px 15px rgba(42,171,238,0.4);transition:transform 0.2s;animation:button-pop 1.5s infinite}
.join-btn:active{transform:scale(0.96)}
@keyframes button-pop{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.secure-tag{font-size:11px;color:#00d26a;font-weight:600;margin-bottom:12px}
.footer{font-size:11px;color:#888;line-height:1.4;margin-top:12px;border-top:1px solid #333640;padding-top:12px}

</head>
<body>
<div class="container">
